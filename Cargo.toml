[workspace]
resolver = "2"
members = [
    "irc",
    "irc-daemon",
    "irc-directory",
    "irc-logging",
    "sspi-ntlm",
    "sspi-gatekeeper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["IRC7 Team"]
license = "MIT"
repository = "https://github.com/irc7-com/irc7"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
parking_lot = "0.12"
dashmap = "5.5"
bytes = "1.5"
futures = "0.3"
base64 = "0.21"
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
